<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffcad4" />
    <title>Our Shaadi Story — Kirti &amp; Dharmil</title>
    <meta name="description" content="An animated wedding film — Kirti & Dharmil and every celebration, scene by scene." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff8fab'/%3E%3Cpath d='M12 9L23 16L12 23Z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@400;500;600;700&family=Kaushan+Script&family=Noto+Serif+Devanagari:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="stage" id="stage" aria-label="Our Shaadi Story — an animated wedding invitation">
      <div class="film" id="film"></div>

      <!-- the poster you see before pressing play -->
      <section class="cover" aria-labelledby="cover-title">
        <p class="cover__pre">An animated wedding film</p>
        <h1 class="cover__title" id="cover-title">Our Shaadi Story</h1>
        <p class="cover__names" id="cover-names"></p>
        <p class="cover__date" id="cover-date"></p>
        <button class="play" id="play-btn" type="button"><span class="play__ring" aria-hidden="true"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 L19 12 L8 19Z" /></svg>Play our story</button>
        <p class="cover__hint">Sound on · every celebration, scene by scene</p>
      </section>

      <!-- film chrome -->
      <div class="bars" id="bars" aria-hidden="true"></div>
      <div class="topbtns">
        <button class="ic" id="sound-btn" type="button" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-speaker" d="M4 9h4l5-4v14l-5-4H4z" /><path class="i-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /><path class="i-mute" d="M16 9l6 6M22 9l-6 6" /></svg>
          <span class="sr-only">Sound</span>
        </button>
        <button class="ic" id="replay-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" /></svg>
          <span class="sr-only">Replay the film</span>
        </button>
      </div>
      <nav class="nav" aria-label="Scenes">
        <button class="ic ic--nav" id="prev-btn" type="button" aria-label="Previous scene"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
        <p class="nav__label" id="label" aria-live="polite"></p>
        <button class="ic ic--nav" id="pause-btn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z" /><path class="i-play" d="M8 5 L19 12 L8 19Z" /></svg></button>
        <button class="ic ic--nav" id="next-btn" type="button" aria-label="Next scene"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
      </nav>
    </main>

    <script src="core.js" defer></script>
    <script src="people.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
