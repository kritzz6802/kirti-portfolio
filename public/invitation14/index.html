<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efe4d6" />
    <title>Kirti &amp; Dharmil — a pop-up invitation</title>
    <meta name="description" content="Open the card — a 3D paper pop-up wedding invitation." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23fffaf2'/%3E%3Cpath d='M6 26V14C6 8 26 8 26 14V26Z' fill='%23f4acb7'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Italianno&family=Jost:wght@400;500&family=Noto+Serif+Devanagari:wght@400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="stage" id="stage" aria-label="A 3D paper pop-up wedding invitation">
      <div class="table" aria-hidden="true"></div>

      <div class="camera" id="camera">
        <div class="card">
          <!-- the card's base: the pop-up layers stand on it -->
          <div class="floor">
            <span class="floor__paper"></span>
            <div id="floor-layers"></div>
          </div>
          <!-- the back half: closed it is the cover, open it stands up as the backdrop -->
          <div class="wall">
            <div class="wall__face wall__face--out">
              <div class="cover">
                <span class="cover__lace"></span>
                <span class="cover__mono" id="cover-mono"></span>
                <p class="cover__pre">Together with their families</p>
                <p class="cover__names" id="cover-names"></p>
                <p class="cover__date" id="cover-date"></p>
              </div>
            </div>
            <div class="wall__face wall__face--in" id="walls"></div>
          </div>
        </div>
      </div>

      <div id="tags"></div>

      <button class="open" id="open-btn" type="button"><span class="open__ring" aria-hidden="true"></span>Open the card</button>
      <p class="hint" aria-hidden="true">tilt or move to see the layers</p>

      <div class="bars" id="bars" aria-hidden="true"></div>
      <div class="topbtns">
        <button class="ic" id="sound-btn" type="button" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-speaker" d="M4 9h4l5-4v14l-5-4H4z" /><path class="i-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /><path class="i-mute" d="M16 9l6 6M22 9l-6 6" /></svg><span class="sr-only">Sound</span></button>
        <button class="ic" id="replay-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" /></svg><span class="sr-only">Back to the first page</span></button>
      </div>
      <nav class="nav" aria-label="Pages">
        <button class="ic" id="prev-btn" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
        <p class="nav__label" id="label" aria-live="polite"></p>
        <button class="ic" id="pause-btn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z" /><path class="i-play" d="M8 5 L19 12 L8 19Z" /></svg></button>
        <button class="ic" id="next-btn" type="button" aria-label="Next page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
      </nav>
    </main>

    <script src="core.js" defer></script>
    <script src="art.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
