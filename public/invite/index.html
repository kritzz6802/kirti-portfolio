<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf6ef" />
    <title>Kirti &amp; Dharmil — Choose an invitation</title>
    <meta name="description" content="Eleven animated wedding invitation designs for Kirti & Dharmil." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23c9a24b' stroke-width='2'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Georgia' font-size='13' fill='%23c9a24b'%3EDK%3C/text%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="petals" aria-hidden="true"></div>

    <header class="hero">
      <svg class="crest" viewBox="-110 -110 220 220" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8a6420" /><stop offset=".3" stop-color="#d4ae58" /><stop offset=".5" stop-color="#f7e8b4" />
            <stop offset=".7" stop-color="#c99f45" /><stop offset="1" stop-color="#8f6a24" />
          </linearGradient>
        </defs>
        <circle class="crest__ring" pathLength="1" r="100" fill="none" stroke="url(#g)" stroke-width="2.4" />
        <circle class="crest__ring" pathLength="1" r="92" fill="none" stroke="#d4ae58" stroke-width=".8" stroke-dasharray=".004 .012" />
        <text class="crest__letter" x="-14" y="30" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="80" fill="url(#g)">D</text>
        <text class="crest__letter crest__letter--b" x="10" y="33" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="86" fill="url(#g)">K</text>
      </svg>
      <p class="eyebrow">The wedding of</p>
      <h1 class="names"><span>Kirti</span> <em>&amp;</em> <span>Dharmil</span></h1>
      <p class="lede">Eleven animated invitations, each with music. Open one to see it play.</p>
    </header>

    <main class="gallery" id="gallery" aria-label="Invitation designs"></main>

    <footer class="footer">
      <p>Tap a card to open that invitation · Each one plays best on a phone, with sound on</p>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
