<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbe9ec" />
    <title>Kirti &amp; Dharmil — Shubh Vivah</title>
    <meta name="description" content="A Pichwai scroll invitation — tap to unroll." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23fbe3ea'/%3E%3Cpath d='M16 26C10 20 10 12 16 6C22 12 22 20 16 26Z' fill='%23e05a8c'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Noto+Serif+Devanagari:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="stage" id="stage" aria-label="Wedding invitation">
      <div class="drift" aria-hidden="true"></div>
      <svg class="ground" viewBox="0 0 600 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true" data-art="ground"></svg>

      <!-- ============================================================ CLOSED SCROLL -->
      <section class="closed" id="closed">
        <p class="closed__deva" lang="hi">शुभ विवाह</p>
        <p class="caps closed__eyebrow">A Pichwai scroll for you</p>
        <div class="roll" id="roll" aria-hidden="true">
          <span class="roll__cap roll__cap--l"></span>
          <span class="roll__body"></span>
          <span class="roll__cap roll__cap--r"></span>
          <span class="roll__tie"></span>
          <span class="roll__tassel"><i></i></span>
          <span class="roll__tag"><b data-field="tagNames"></b><small>are getting married</small></span>
        </div>
        <button class="unroll" id="open-btn" type="button"><span class="unroll__ring" aria-hidden="true"></span>Tap to unroll</button>
      </section>

      <!-- ============================================================ THE OPEN SCROLL -->
      <section class="scroll" id="scroll" aria-label="The invitation">
        <div class="rod rod--top" aria-hidden="true"><i class="rod__cap"></i><i class="rod__cap rod__cap--r"></i><i class="rod__tassel"></i><i class="rod__tassel rod__tassel--r"></i></div>

        <div class="paper" id="paper" tabindex="0">
          <div class="paper__content">
            <svg class="toran" viewBox="0 0 600 112" aria-hidden="true" data-art="toran"></svg>

            <div class="blessing reveal">
              <div class="blessing__arch"><span data-art-html="ganesha"></span></div>
              <p class="shloka" lang="sa" data-field="shloka"></p>
            </div>

            <h1 class="shubh reveal" lang="hi">शुभ विवाह</h1>
            <p class="caps eyebrow reveal" data-field="openingMessage"></p>

            <div class="couple reveal">
              <p class="couple__name" data-field="firstName"></p>
              <p class="caps couple__sur" data-field="firstSurname"></p>
              <p class="couple__weds">weds</p>
              <p class="couple__name" data-field="secondName"></p>
              <p class="caps couple__sur" data-field="secondSurname"></p>
            </div>

            <svg class="cows reveal" viewBox="20 100 560 200" aria-hidden="true" data-art="cows"></svg>
            <p class="lede reveal" data-field="inviteLine"></p>

            <div class="divider reveal" aria-hidden="true"><svg viewBox="0 0 200 30"><use href="#lotus" transform="translate(100 26) scale(.7)" /><path d="M10 22 H70 M130 22 H190" stroke="url(#gold)" stroke-width="1.2" /></svg></div>

            <section class="families reveal" aria-label="Families">
              <p class="caps eyebrow">With the blessings of</p>
              <div class="families__row" data-list="families"></div>
              <p class="lede" data-field="familiesMessage"></p>
            </section>

            <section class="date reveal" aria-label="Wedding date">
              <p class="caps eyebrow">Save the date</p>
              <div class="medallion">
                <svg viewBox="-125 -125 250 250" aria-hidden="true" data-art="medallion"></svg>
                <div class="medallion__text">
                  <span class="caps" data-field="weekdayName"></span>
                  <b data-field="dayNumber"></b>
                  <span class="caps"><span data-field="monthName"></span> <span data-field="year"></span></span>
                </div>
              </div>
              <p class="date__time">at <span data-field="timeLabel"></span></p>
              <dl class="buds">
                <div><dd data-c="days">0</dd><dt>days</dt></div>
                <div><dd data-c="hours">0</dd><dt>hours</dt></div>
                <div><dd data-c="minutes">0</dd><dt>minutes</dt></div>
                <div><dd data-c="seconds">0</dd><dt>seconds</dt></div>
              </dl>
            </section>

            <section class="celebrations" aria-labelledby="cel-title">
              <h2 class="title reveal" id="cel-title">Celebrations</h2>
              <div class="panels" data-list="events"></div>
            </section>

            <section class="venue reveal" aria-labelledby="venue-title">
              <h2 class="title" id="venue-title">The Venue</h2>
              <svg class="pond" viewBox="0 0 300 180" aria-hidden="true" data-art="pond"></svg>
              <p class="venue__name" data-field="venue"></p>
              <p class="caps eyebrow" data-field="city"></p>
              <p class="lede" data-field="address"></p>
              <a class="btn" data-href="mapHref" target="_blank" rel="noopener">Open in Maps</a>
            </section>

            <section class="story reveal" aria-labelledby="story-title" data-optional="story">
              <h2 class="title" id="story-title">Our Story</h2>
              <div class="story__frame" data-list="story"></div>
            </section>

            <section class="rsvp reveal" aria-labelledby="rsvp-title">
              <button class="bell" id="bell" type="button" aria-label="Ring the temple bell">
                <svg viewBox="-50 0 100 155" aria-hidden="true" data-art="bell"></svg>
              </button>
              <p class="bell__hint">Ring the bell for blessings</p>
              <h2 class="title" id="rsvp-title">Kindly Reply</h2>
              <p class="caps eyebrow">by <span data-field="rsvpByLong"></span></p>
              <a class="btn" data-href="rsvpHref" target="_blank" rel="noopener">RSVP on WhatsApp</a>
              <div class="contacts" data-list="contacts"></div>
              <p class="closing" data-field="closingMessage"></p>
              <p class="caps eyebrow" data-field="tagNames"></p>
            </section>

            <div class="koipond" aria-hidden="true">
              <svg class="koipond__pads" viewBox="0 0 600 120" preserveAspectRatio="xMidYMid slice" data-art="koipads"></svg>
              <svg class="koi koi--1" viewBox="-16 -12 64 24"><g data-art="koi"></g></svg>
              <svg class="koi koi--2" viewBox="-16 -12 64 24"><g data-art="koi"></g></svg>
              <svg class="koi koi--3" viewBox="-16 -12 64 24"><g data-art="koi"></g></svg>
            </div>
          </div>
        </div>

        <div class="rod rod--bottom" aria-hidden="true"><i class="rod__cap"></i><i class="rod__cap rod__cap--r"></i></div>
      </section>

      <div class="controls">
        <button class="ctl" id="sound-btn" type="button" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-speaker" d="M4 9h4l5-4v14l-5-4H4z" /><path class="i-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /><path class="i-mute" d="M16 9l6 6M22 9l-6 6" /></svg>
          <span class="sr-only">Sound</span>
        </button>
        <button class="ctl" id="replay-btn" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" /></svg>
          <span class="sr-only">Roll the scroll up and play again</span>
        </button>
      </div>
    </main>

    <svg class="sr-only" aria-hidden="true"><defs id="defs"></defs></svg>
    <script src="core.js" defer></script>
    <script src="art.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
