<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1430" />
    <title>Kirti &amp; Dharmil — Written in the Stars</title>
    <meta name="description" content="Kirti & Dharmil are getting married. Tap to begin their story." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1430'/%3E%3Cpath d='M16 6c1 6 4 9 10 10c-6 1-9 4-10 10c-1-6-4-9-10-10c6-1 9-4 10-10z' fill='%23e8b4a6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Noto+Serif+Devanagari:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="stage" id="stage" aria-label="Wedding invitation">
      <canvas class="sky" id="sky" aria-hidden="true"></canvas>

      <!-- ============================================================ OPENING: the constellation -->
      <section class="opening" id="opening" aria-labelledby="opening-names">
        <svg class="constellation" id="constellation" viewBox="0 0 300 200" aria-hidden="true">
          <g class="constellation__lines"></g>
          <g class="constellation__stars"></g>
        </svg>
        <p class="caps opening__eyebrow">Written in the stars</p>
        <h1 class="opening__names" id="opening-names"></h1>
        <p class="opening__sub">are getting married</p>
        <button class="begin" id="begin" type="button">
          <span class="begin__ring" aria-hidden="true"></span>
          Tap to begin our story
        </button>
      </section>

      <!-- ============================================================ STORIES -->
      <section class="stories" id="stories" aria-roledescription="story" aria-label="The invitation, one story at a time" hidden>
        <div class="bars" id="bars" aria-hidden="true"></div>
        <header class="storyhead">
          <span class="storyhead__avatar" aria-hidden="true"></span>
          <span class="storyhead__who"><b id="who"></b><small>our wedding story</small></span>
          <button class="iconbtn" id="sound-btn" type="button" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path class="i-speaker" d="M4 9h4l5-4v14l-5-4H4z" /><path class="i-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /><path class="i-mute" d="M16 9l6 6M22 9l-6 6" />
            </svg>
            <span class="sr-only">Sound</span>
          </button>
          <button class="iconbtn" id="replay-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" /></svg>
            <span class="sr-only">Replay from the start</span>
          </button>
        </header>
        <div class="slides" id="slides"></div>
        <button class="zone zone--prev" id="prev" type="button"><span class="sr-only">Previous</span></button>
        <button class="zone zone--next" id="next" type="button"><span class="sr-only">Next</span></button>
        <p class="hint" id="hint" aria-hidden="true">Tap to continue · hold to pause</p>
      </section>
    </main>

    <script src="core.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
