<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a0b" />
    <title>Kirti &amp; Dharmil — A Reel of Forever</title>
    <meta name="description" content="Kirti & Dharmil are getting married — a cinematic wedding invitation." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0a0b'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Georgia' font-size='12' fill='%23d9b56c'%3EK%26D%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,400&family=Pinyon+Script&family=Montserrat:wght@300;400;500&family=Noto+Serif+Devanagari:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="stage" id="stage" aria-label="A cinematic wedding invitation">
      <div class="film" id="film"></div>
      <span class="grain" aria-hidden="true"></span>

      <!-- poster -->
      <section class="poster" aria-labelledby="poster-names">
        <div class="kb"><img data-photo="poster" alt="" /></div>
        <span class="shade" aria-hidden="true"></span>
        <svg class="frame" viewBox="0 0 100 178" preserveAspectRatio="none" aria-hidden="true"><rect pathLength="1" x="4" y="4" width="92" height="170" /></svg>
        <div class="poster__text">
          <p class="eyebrow">The wedding of</p>
          <h1 class="poster__names" id="poster-names"></h1>
          <p class="poster__date" id="poster-date"></p>
          <button class="play" id="play-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 L19 12 L8 19Z" /></svg><span>Begin our story</span></button>
          <p class="poster__hint">Best with sound on</p>
        </div>
      </section>

      <!-- film chrome -->
      <div class="bars" id="bars" aria-hidden="true"></div>
      <div class="topbtns">
        <button class="ic" id="sound-btn" type="button" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-speaker" d="M4 9h4l5-4v14l-5-4H4z" /><path class="i-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /><path class="i-mute" d="M16 9l6 6M22 9l-6 6" /></svg>
          <span class="sr-only">Sound</span>
        </button>
        <button class="ic" id="replay-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" /></svg><span class="sr-only">Replay</span></button>
      </div>
      <nav class="nav" aria-label="Chapters">
        <button class="ic" id="prev-btn" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
        <p class="nav__label" id="label" aria-live="polite"></p>
        <button class="ic" id="pause-btn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z" /><path class="i-play" d="M8 5 L19 12 L8 19Z" /></svg></button>
        <button class="ic" id="next-btn" type="button" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
      </nav>
    </main>

    <script src="core.js" defer></script>
    <script src="photos.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
